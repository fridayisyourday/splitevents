
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">

    <title>Сплит — SplitEvents</title>

    <meta
        name="description"
        content="SplitEvents — приложение для организации совместных мероприятий."
    >

    <meta name="robots" content="index, follow">

    <link
        rel="canonical"
        href="https://fridayisyourday.github.io/splitevents/"
    >

    <!-- Telegram SDK -->
    <script
        src="https://telegram.org/js/telegram-web-app.js"
        defer
    ></script>

    <!-- Стили -->
    <link rel="stylesheet" href="./style.css">

    <!-- Логика приложения -->
    <script src="./app.js" defer></script>
</head>

<body>

    <a class="skip-link" href="#main-content">
        Перейти к основному содержимому
    </a>

    <div id="app">

        <!-- HEADER -->

        <header class="site-header">

            <!-- Кнопка меню -->
            <button
                id="menu-button"
                class="header-button"
                type="button"
                aria-label="Открыть меню"
                title="Меню"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    <path d="M4 7H20"/>
                    <path d="M4 12H20"/>
                    <path d="M4 17H20"/>
                </svg>
            </button>

            <!-- Логотип -->
            <div
                class="header-logo"
                aria-label="Сплит"
            >
                сплит
            </div>

            <!-- Кнопка профиля / домой -->
            <button
                id="profile-home-button"
                class="header-button"
                type="button"
                aria-label="Открыть профиль"
                title="Профиль"
            >

                <!-- Иконка профиля -->
                <svg
                    class="profile-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5 20C5 16.4 8.1 14 12 14C15.9 14 19 16.4 19 20"/>
                </svg>

                <!-- Иконка домой -->
                <svg
                    class="home-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    hidden
                >
                    <path d="M3 10.5L12 3L21 10.5"/>
                    <path d="M5 9.5V20H19V9.5"/>
                    <path d="M9 20V14H15V20"/>
                </svg>

            </button>

        </header>

        <!-- MAIN CONTENT -->

        <main
            id="main-content"
            class="page-content"
            tabindex="-1"
        >

            <!-- ГЛАВНАЯ СТРАНИЦА -->
            <section
                id="home-page"
                class="page-view"
                aria-label="Главная страница"
            >
            </section>

            <!-- СТРАНИЦА ПРОФИЛЯ -->
            <section
                id="profile-page"
                class="page-view"
                aria-label="Профиль"
                hidden
            >
            </section>

        </main>

    </div>

    <noscript>
        <p>Для работы SplitEvents необходимо включить JavaScript.</p>
    </noscript>

</body>
</html>

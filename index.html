
<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Основные настройки документа -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">

    <!-- SEO -->
    <title>Сплит — SplitEvents</title>

    <meta
        name="description"
        content="SplitEvents — приложение для организации совместных мероприятий."
    >

    <meta name="robots" content="index, follow">

    <link
        rel="canonical"
        href="https://fridayisyourday.github.io/splitevents/"
    >

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Сплит — SplitEvents">
    <meta
        property="og:description"
        content="Приложение SplitEvents."
    >
    <meta
        property="og:url"
        content="https://fridayisyourday.github.io/splitevents/"
    >

    <!-- Telegram Mini Apps SDK -->
    <script
        src="https://telegram.org/js/telegram-web-app.js"
        defer
    ></script>

    <!-- Основные стили -->
    <link rel="stylesheet" href="./style.css">

    <!-- Основная логика -->
    <script src="./app.js" defer></script>
</head>

<body>

    <!-- Ссылка для быстрого перехода к содержимому -->
    <a class="skip-link" href="#main-content">
        Перейти к основному содержимому
    </a>

    <div id="app">

        <!-- =================================
             HEADER
             ================================= -->

        <header class="site-header">

            <button
                id="menu-button"
                class="header-button"
                type="button"
                aria-label="Открыть меню"
                title="Меню"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    <path d="M4 7H20"/>
                    <path d="M4 12H20"/>
                    <path d="M4 17H20"/>
                </svg>
            </button>

            <div
                class="header-logo"
                aria-label="Сплит"
            >
                сплит
            </div>

            <button
                id="profile-button"
                class="header-button"
                type="button"
                aria-label="Открыть профиль"
                title="Профиль"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5 20C5 16.4 8.1 14 12 14C15.9 14 19 16.4 19 20"/>
                </svg>
            </button>

        </header>

        <!-- =================================
             MAIN CONTENT
             ================================= -->

        <main
            id="main-content"
            class="page-content"
        >

            <!--
                Здесь будет находиться содержимое
                приложения SplitEvents.
            -->

        </main>

    </div>

    <!-- Сообщение на случай отключённого JavaScript -->
    <noscript>
        <p>
            Для работы SplitEvents необходимо включить JavaScript.
        </p>
    </noscript>

</body>
</html>

    <!-- Telegram SDK подключается до модулей приложения. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function () {
            const telegramScheme = window.Telegram && window.Telegram.WebApp
                ? window.Telegram.WebApp.colorScheme
                : null;
            const systemDark = window.matchMedia
                && window.matchMedia("(prefers-color-scheme: dark)").matches;
            let savedScheme = null;
            try {
                savedScheme = window.localStorage.getItem("splitevents-color-scheme");
            } catch {
                savedScheme = null;
            }
            const scheme = savedScheme === "dark" || savedScheme === "light"
                ? savedScheme
                : (telegramScheme === "dark" || telegramScheme === "light"
                    ? telegramScheme
                    : (systemDark ? "dark" : "light"));
            document.documentElement.dataset.colorScheme = scheme;
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.content = scheme === "dark" ? "#000000" : "#FFFFFF";
        })();
    </script>

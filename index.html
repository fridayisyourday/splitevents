<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#FFFFFF">
    <meta
        name="description"
        content="SplitEvents — приложение для организации совместных мероприятий."
    >
    <meta name="robots" content="index, follow">

    <title>Сплит — SplitEvents</title>

    <link
        rel="canonical"
        href="https://fridayisyourday.github.io/splitevents/"
    >

    <!-- Telegram SDK подключается до модулей приложения. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function () {
            const telegramScheme = window.Telegram && window.Telegram.WebApp
                ? window.Telegram.WebApp.colorScheme
                : null;
            const systemDark = window.matchMedia
                && window.matchMedia("(prefers-color-scheme: dark)").matches;
            const scheme = telegramScheme === "dark" || telegramScheme === "light"
                ? telegramScheme
                : (systemDark ? "dark" : "light");
            document.documentElement.dataset.colorScheme = scheme;
        })();
    </script>

    <!-- Общие стили приложения. -->
    <link rel="stylesheet" href="./css/base.css?v=20261126-10">
    <link rel="stylesheet" href="./css/components.css?v=20261126-6">
    <link rel="stylesheet" href="./css/layout.css?v=20261126-4">
    <link rel="stylesheet" href="./css/menu.css?v=20261126-11">
    <link rel="stylesheet" href="./css/profile.css?v=20261126-10">
    <link rel="stylesheet" href="./css/friends.css?v=20261126-1">
    <link rel="stylesheet" href="./css/pages.css?v=20261126-5">
    <link rel="stylesheet" href="./css/events.css?v=20261126-18">
    <link rel="stylesheet" href="./css/nominations.css?v=20261126-19">
    <link rel="stylesheet" href="./css/nominations-carousel.css?v=20261126-9">
    <link rel="stylesheet" href="./css/nominations-picker.css?v=20261126-1">
    <link rel="stylesheet" href="./css/nominations-cards.css?v=20261126-5">
    <link rel="stylesheet" href="./css/design-system.css?v=20261126-20">
    <link rel="stylesheet" href="./css/notifications.css?v=20261126-2">

    <!-- ES-модуль приложения загружает остальные JS-модули. -->
    <script type="module" src="./app.js?v=20261126-50"></script>
</head>

<body>
    <a class="skip-link" href="#main-content">
        Перейти к основному содержимому
    </a>

    <div id="app">
        <!-- Lucide icon sprite: one shared outline style for all interface icons. -->
        <svg class="icon-sprite" aria-hidden="true" focusable="false">
            <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></symbol>
            <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></symbol>
            <symbol id="icon-house" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></symbol>
            <symbol id="icon-user-round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></symbol>
            <symbol id="icon-ticket" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></symbol>
            <symbol id="icon-server" viewBox="0 0 24 24"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect><rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect><line x1="6" x2="6.01" y1="6" y2="6"></line><line x1="6" x2="6.01" y1="18" y2="18"></line></symbol>
            <symbol id="icon-users-round" viewBox="0 0 24 24"><path d="M18 21a8 8 0 0 0-16 0"></path><circle cx="10" cy="8" r="5"></circle><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path></symbol>
            <symbol id="icon-calendar-clock" viewBox="0 0 24 24"><path d="M16 2v3"></path><path d="M17 15.5v1.7l1 .625"></path><path d="M21 8.936V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.935"></path><path d="M3 9h9.873"></path><path d="M8 2v3"></path><circle cx="17" cy="17" r="5"></circle></symbol>
            <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path></symbol>
            <symbol id="icon-loader-circle" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></symbol>
            <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></symbol>
            <symbol id="icon-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></symbol>
            <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></symbol>
            <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></symbol>
            <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></symbol>
            <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></symbol>
            <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></symbol>
        </svg>
        <header class="site-header">
            <button
                id="menu-button"
                class="header-button ui-button ui-button--icon ui-button--secondary"
                type="button"
                aria-label="Открыть меню"
                aria-controls="menu-panel"
                aria-expanded="false"
                title="Меню"
            >
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-menu"></use></svg>
            </button>

            <div class="header-logo" aria-label="Сплит">
                сплит
            </div>
        </header>

        <!-- БОКОВАЯ НАВИГАЦИЯ -->
        <div id="menu-overlay" class="menu-overlay" hidden>
            <button
                id="menu-backdrop"
                class="menu-backdrop"
                type="button"
                aria-label="Закрыть меню"
                tabindex="-1"
            ></button>

            <aside
                id="menu-panel"
                class="menu-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="menu-title"
                tabindex="-1"
            >
                <div class="menu-panel-header">
                    <h2 id="menu-title" class="menu-panel-title">Меню</h2>
                    <button
                        id="menu-close-button"
                        class="menu-close-button ui-button ui-button--icon ui-button--secondary"
                        type="button"
                        aria-label="Закрыть меню"
                        title="Закрыть меню"
                    >
                        <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-x"></use></svg>
                    </button>
                </div>

                <nav class="menu-navigation" aria-label="Основная навигация">
                    <button id="home-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="lucide-icon menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-house"></use></svg>
                        <span class="menu-item-label">Главная</span>
                    </button>

                    <button id="profile-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="lucide-icon menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-user-round"></use></svg>
                        <span class="menu-item-label">Профиль</span>
                    </button>

                    <button id="events-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="lucide-icon menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-ticket"></use></svg>
                        <span class="menu-item-label">События</span>
                        <span
                            id="events-active-badge"
                            class="menu-item-badge"
                            role="status"
                            aria-live="polite"
                            hidden
                        ></span>
                    </button>

                    <button id="servers-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="lucide-icon menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-server"></use></svg>
                        <span class="menu-item-label">Сервера</span>
                    </button>

                    <button id="friends-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="lucide-icon menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-users-round"></use></svg>
                        <span class="menu-item-label">Друзья</span>
                    </button>

                    <button class="menu-item menu-item-coming-soon ui-button ui-button--nav ui-button--ghost" type="button" disabled>
                        <svg class="lucide-icon menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-calendar-clock"></use></svg>
                        <span class="menu-item-label">Human Glaze</span>
                        <span class="menu-item-badge menu-item-badge--accent">скоро</span>
                    </button>
                </nav>
            </aside>
        </div>

        <main id="main-content" class="page-content" tabindex="-1">
            <section
                id="home-page"
                class="page-view"
                aria-label="Главная страница"
            ></section>

            <section
                id="events-page"
                class="page-view"
                aria-label="Текущие события"
                hidden
            ></section>

            <section
                id="profile-page"
                class="page-view"
                aria-label="Профиль"
                hidden
            >
                <article class="profile-card" id="profile-card">
                    <div class="profile-cover" id="profile-cover">
                        <div
                            class="profile-banner-placeholder"
                            id="profile-banner-placeholder"
                            aria-hidden="true"
                        ></div>

                        <img
                            id="profile-banner-image"
                            class="profile-banner-image"
                            alt=""
                            hidden
                        >

                        <div class="profile-media-shade" aria-hidden="true"></div>

                        <button
                            id="banner-upload-button"
                            class="profile-media-upload-button banner-upload-button ui-button ui-button--icon ui-button--round ui-button--media"
                            type="button"
                            aria-label="Загрузить баннер"
                            title="Загрузить баннер"
                            tabindex="-1"
                        >
                            <svg class="lucide-icon profile-media-icon profile-media-icon--plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-plus"></use></svg>
                            <svg class="lucide-icon profile-media-icon profile-media-icon--spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-loader-circle"></use></svg>
                            <svg class="lucide-icon profile-media-icon profile-media-icon--error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-x"></use></svg>
                        </button>

                        <div class="profile-avatar" id="profile-avatar">
                            <img
                                id="profile-avatar-image"
                                class="profile-avatar-image"
                                alt="Фотография профиля"
                                referrerpolicy="no-referrer"
                                hidden
                            >

                            <div
                                id="profile-avatar-placeholder"
                                class="profile-avatar-placeholder"
                                aria-hidden="true"
                            >
                                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-user-round"></use></svg>
                            </div>

                            <div class="profile-media-shade" aria-hidden="true"></div>

                            <button
                                id="avatar-upload-button"
                                class="profile-media-upload-button avatar-upload-button ui-button ui-button--icon ui-button--round ui-button--media"
                                type="button"
                                aria-label="Загрузить аватарку"
                                title="Загрузить аватарку"
                                tabindex="-1"
                            >
                            <svg class="lucide-icon profile-media-icon profile-media-icon--plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-plus"></use></svg>
                            <svg class="lucide-icon profile-media-icon profile-media-icon--spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-loader-circle"></use></svg>
                            <svg class="lucide-icon profile-media-icon profile-media-icon--error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-x"></use></svg>
                        </button>
                        </div>
                    </div>

                    <div class="profile-details">
                        <div class="profile-name-row">
                            <span
                                id="nickname-display"
                                class="profile-nickname"
                            ></span>

                            <button
                                id="nickname-edit-button"
                                class="profile-edit-button ui-button ui-button--icon ui-button--secondary"
                                type="button"
                                aria-label="Изменить профиль"
                                title="Изменить профиль"
                            >
                                <svg class="lucide-icon nickname-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-pencil"></use></svg>
                            </button>
                        </div>

                        <p id="telegram-tag" class="profile-telegram-tag"></p>
                    </div>
                </article>

                <input
                    id="avatar-file-input"
                    class="visually-hidden-input"
                    type="file"
                    accept="image/*"
                    aria-label="Выбрать фотографию профиля"
                    tabindex="-1"
                >

                <input
                    id="banner-file-input"
                    class="visually-hidden-input"
                    type="file"
                    accept="image/*"
                    aria-label="Выбрать изображение баннера"
                    tabindex="-1"
                >
            </section>

            <!-- ВРЕМЕННАЯ СТРАНИЦА РАЗДЕЛА СЕРВЕРОВ -->
            <section
                id="servers-page"
                class="page-view"
                aria-label="Сервера"
                hidden
            ></section>

            <section
                id="friends-page"
                class="page-view"
                aria-label="Друзья"
                hidden
            ></section>

            <section
                id="user-profile-page"
                class="page-view"
                aria-label="Профиль пользователя"
                hidden
            ></section>

            <section
                id="nominations-page"
                class="page-view"
                aria-label="Номинации 2026"
                hidden
            >
                <div class="section-page nominations-page">
                    <div class="section-page-content nominations-page-content">
                        <header class="nominations-page-header">
                            <h1 class="section-page-title">НОМИНАЦИИ 2026</h1>
                        </header>

                        <div id="vote-widget" class="vote-widget">
                            <div
                                id="vote-nominations-list"
                                class="vote-nominations-list"
                                aria-label="Список номинаций"
                            ></div>

                            <div class="vote-overlay" id="vote-vote-overlay" hidden>
                                <section
                                    class="vote-dialog vote-dialog--nomination"
                                    role="dialog"
                                    aria-modal="true"
                                    aria-labelledby="vote-vote-title"
                                >
                                    <header class="vote-dialog-header">
                                        <p class="vote-dialog-eyebrow">НОМИНАЦИЯ</p>
                                        <h2 id="vote-vote-title" class="vote-dialog-title">
                                            Выбери номинанта
                                        </h2>
                                    </header>
                                    <div class="vote-grid-viewport">
                                        <div id="vote-nomination-grid" class="vote-grid"></div>
                                    </div>
                                    <footer class="vote-dialog-footer">
                                        <button
                                            id="vote-nomination-prev"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Предыдущие номинанты"
                                            disabled
                                        ><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-chevron-left"></use></svg></button>
                                        <button
                                            id="vote-vote-close"
                                            class="ui-button ui-button--secondary vote-close-button"
                                            type="button"
                                        >Закрыть</button>
                                        <button
                                            id="vote-nomination-next"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Следующие номинанты"
                                            disabled
                                        ><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-chevron-right"></use></svg></button>
                                    </footer>
                                </section>
                            </div>

                            <div class="vote-overlay vote-picker-overlay" id="vote-picker-overlay" hidden>
                                <section
                                    class="vote-dialog"
                                    role="dialog"
                                    aria-modal="true"
                                    aria-labelledby="vote-picker-title"
                                >
                                    <header class="vote-dialog-header">
                                        <p class="vote-dialog-eyebrow">ДОБАВИТЬ НОМИНАНТА</p>
                                        <h2 id="vote-picker-title" class="vote-dialog-title">
                                            Добавить номинанта
                                        </h2>
                                    </header>
                                    <div class="vote-grid-viewport">
                                        <div id="vote-picker-grid" class="vote-grid"></div>
                                        <p id="vote-picker-empty" class="vote-empty-state" hidden>
                                            Все подходящие участники уже добавлены
                                        </p>
                                    </div>
                                    <footer class="vote-dialog-footer">
                                        <button
                                            id="vote-picker-prev"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Предыдущие участники"
                                            disabled
                                        ><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-chevron-left"></use></svg></button>
                                        <button
                                            id="vote-picker-close"
                                            class="ui-button ui-button--secondary vote-close-button"
                                            type="button"
                                        >Назад</button>
                                        <button
                                            id="vote-picker-next"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Следующие участники"
                                            disabled
                                        ><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-chevron-right"></use></svg></button>
                                    </footer>
                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <div
            id="notification-region"
            class="notification-region"
            aria-label="уведомления"
        ></div>
    </div>

    <noscript>
        <p>Для работы SplitEvents необходимо включить JavaScript.</p>
    </noscript>
</body>
</html>

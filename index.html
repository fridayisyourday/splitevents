<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <meta
        name="description"
        content="SplitEvents — приложение для организации совместных мероприятий."
    >
    <meta name="robots" content="index, follow">

    <title>Сплит — SplitEvents</title>

    <link
        rel="canonical"
        href="https://fridayisyourday.github.io/splitevents/"
    >

    <!-- Telegram SDK подключается до модулей приложения. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Общие стили приложения. -->
    <link rel="stylesheet" href="./css/base.css?v=20261126-2">
    <link rel="stylesheet" href="./css/layout.css?v=20261126-2">
    <link rel="stylesheet" href="./css/menu.css?v=20261126-3">
    <link rel="stylesheet" href="./css/profile.css?v=20261126-2">
    <link rel="stylesheet" href="./css/pages.css?v=20261126-4">
    <link rel="stylesheet" href="./css/events.css?v=20261126-4">

    <!-- ES-модуль приложения загружает остальные JS-модули. -->
    <script type="module" src="./app.js?v=20261126-7"></script>
</head>

<body>
    <a class="skip-link" href="#main-content">
        Перейти к основному содержимому
    </a>

    <div id="app">
        <header class="site-header">
            <button
                id="menu-button"
                class="header-button"
                type="button"
                aria-label="Открыть меню"
                aria-controls="menu-panel"
                aria-expanded="false"
                title="Меню"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    <path d="M4 7H20"></path>
                    <path d="M4 12H20"></path>
                    <path d="M4 17H20"></path>
                </svg>
            </button>

            <div class="header-logo" aria-label="Сплит">
                сплит
            </div>
        </header>

        <!-- БОКОВАЯ НАВИГАЦИЯ -->
        <div id="menu-overlay" class="menu-overlay" hidden>
            <button
                id="menu-backdrop"
                class="menu-backdrop"
                type="button"
                aria-label="Закрыть меню"
                tabindex="-1"
            ></button>

            <aside
                id="menu-panel"
                class="menu-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="menu-title"
                tabindex="-1"
            >
                <div class="menu-panel-header">
                    <h2 id="menu-title" class="menu-panel-title">Меню</h2>
                    <button
                        id="menu-close-button"
                        class="menu-close-button"
                        type="button"
                        aria-label="Закрыть меню"
                        title="Закрыть меню"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <path d="M6 6L18 18"></path>
                            <path d="M18 6L6 18"></path>
                        </svg>
                    </button>
                </div>

                <nav class="menu-navigation" aria-label="Основная навигация">
                    <button id="home-nav-button" class="menu-item" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 10.5L12 3L21 10.5"></path>
                            <path d="M5 9.5V20H19V9.5"></path>
                            <path d="M9 20V14H15V20"></path>
                        </svg>
                        <span class="menu-item-label">Главная</span>
                    </button>

                    <button id="profile-nav-button" class="menu-item" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.5"></circle>
                            <path d="M5 20C5 16.4 8.1 14 12 14C15.9 14 19 16.4 19 20"></path>
                        </svg>
                        <span class="menu-item-label">Профиль</span>
                    </button>

                    <button id="events-nav-button" class="menu-item" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 8L7 4L10 8L13 4L16 8L19 4L21 7V20H3V7L4 8Z"></path>
                            <path d="M3 12H21"></path>
                            <path d="M8 12V20"></path>
                            <path d="M16 12V20"></path>
                        </svg>
                        <span class="menu-item-label">События</span>
                        <span
                            id="events-unread-badge"
                            class="menu-item-badge"
                            role="status"
                            aria-live="polite"
                            hidden
                        ></span>
                    </button>

                    <button id="servers-nav-button" class="menu-item" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6.5 9H17.5C19.1 9 20.3 10.2 20.7 11.7L22 16.5C22.5 18.5 20.3 19.9 18.8 18.6L15.7 16H8.3L5.2 18.6C3.7 19.9 1.5 18.5 2 16.5L3.3 11.7C3.7 10.2 4.9 9 6.5 9Z"></path>
                            <path d="M7 11.5V15.5"></path>
                            <path d="M5 13.5H9"></path>
                            <circle cx="16.2" cy="12.5" r="0.8" fill="currentColor" stroke="none"></circle>
                            <circle cx="18.3" cy="14.5" r="0.8" fill="currentColor" stroke="none"></circle>
                        </svg>
                        <span class="menu-item-label">Сервера</span>
                    </button>

                    <button class="menu-item menu-item-coming-soon" type="button" disabled>
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <path d="M3 10H21"></path>
                            <path d="M8 5V10"></path>
                            <path d="M16 5V10"></path>
                        </svg>
                        <span class="menu-item-label">Human Glaze</span>
                        <span class="coming-soon-badge">скоро</span>
                    </button>
                </nav>
            </aside>
        </div>

        <main id="main-content" class="page-content" tabindex="-1">
            <section
                id="home-page"
                class="page-view"
                aria-label="Главная страница"
            ></section>

            <section
                id="events-page"
                class="page-view"
                aria-label="Текущие события"
                hidden
            ></section>

            <section
                id="profile-page"
                class="page-view"
                aria-label="Профиль"
                hidden
            >
                <article class="profile-card" id="profile-card">
                    <div class="profile-cover" id="profile-cover">
                        <div
                            class="profile-banner-placeholder"
                            id="profile-banner-placeholder"
                            aria-hidden="true"
                        ></div>

                        <img
                            id="profile-banner-image"
                            class="profile-banner-image"
                            alt=""
                            hidden
                        >

                        <div class="profile-media-shade" aria-hidden="true"></div>

                        <button
                            id="banner-upload-button"
                            class="profile-media-upload-button banner-upload-button"
                            type="button"
                            aria-label="Загрузить баннер"
                            title="Загрузить баннер"
                            tabindex="-1"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                aria-hidden="true"
                            >
                                <path d="M12 5V19"></path>
                                <path d="M5 12H19"></path>
                            </svg>
                        </button>

                        <div class="profile-avatar" id="profile-avatar">
                            <img
                                id="profile-avatar-image"
                                class="profile-avatar-image"
                                alt="Фотография профиля"
                                referrerpolicy="no-referrer"
                                hidden
                            >

                            <div
                                id="profile-avatar-placeholder"
                                class="profile-avatar-placeholder"
                                aria-hidden="true"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <circle cx="12" cy="8" r="3.5"></circle>
                                    <path d="M5 20C5 16.4 8.1 14 12 14C15.9 14 19 16.4 19 20"></path>
                                </svg>
                            </div>

                            <div class="profile-media-shade" aria-hidden="true"></div>

                            <button
                                id="avatar-upload-button"
                                class="profile-media-upload-button avatar-upload-button"
                                type="button"
                                aria-label="Загрузить аватарку"
                                title="Загрузить аватарку"
                                tabindex="-1"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    aria-hidden="true"
                                >
                                    <path d="M12 5V19"></path>
                                    <path d="M5 12H19"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="profile-details">
                        <div class="profile-name-row">
                            <input
                                id="nickname-input"
                                class="profile-nickname"
                                type="text"
                                maxlength="64"
                                autocomplete="nickname"
                                aria-label="Отображаемое имя"
                                readonly
                            >

                            <button
                                id="nickname-edit-button"
                                class="profile-edit-button"
                                type="button"
                                aria-label="Изменить профиль"
                                title="Изменить профиль"
                            >
                                <svg
                                    class="nickname-edit-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <path d="M12 20H21"></path>
                                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
                                </svg>

                                <svg
                                    class="nickname-save-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                    hidden
                                >
                                    <path d="M5 12L10 17L20 7"></path>
                                </svg>
                            </button>
                        </div>

                        <p id="telegram-tag" class="profile-telegram-tag"></p>
                        <p
                            id="profile-media-status"
                            class="profile-media-status"
                            role="status"
                            aria-live="polite"
                            hidden
                        ></p>
                    </div>
                </article>

                <input
                    id="avatar-file-input"
                    class="visually-hidden-input"
                    type="file"
                    accept="image/*"
                    aria-label="Выбрать фотографию профиля"
                    tabindex="-1"
                >

                <input
                    id="banner-file-input"
                    class="visually-hidden-input"
                    type="file"
                    accept="image/*"
                    aria-label="Выбрать изображение баннера"
                    tabindex="-1"
                >
            </section>

            <!-- ВРЕМЕННАЯ СТРАНИЦА РАЗДЕЛА СЕРВЕРОВ -->
            <section
                id="servers-page"
                class="page-view"
                aria-label="Сервера"
                hidden
            ></section>
        </main>
    </div>

    <noscript>
        <p>Для работы SplitEvents необходимо включить JavaScript.</p>
    </noscript>
</body>
</html>

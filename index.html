<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#FFFFFF">
    <meta
        name="description"
        content="SplitEvents — приложение для организации совместных мероприятий."
    >
    <meta name="robots" content="index, follow">

    <title>Сплит — SplitEvents</title>

    <link
        rel="canonical"
        href="https://fridayisyourday.github.io/splitevents/"
    >

    <!-- Telegram SDK подключается до модулей приложения. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function () {
            const telegramScheme = window.Telegram && window.Telegram.WebApp
                ? window.Telegram.WebApp.colorScheme
                : null;
            const systemDark = window.matchMedia
                && window.matchMedia("(prefers-color-scheme: dark)").matches;
            const scheme = telegramScheme === "dark" || telegramScheme === "light"
                ? telegramScheme
                : (systemDark ? "dark" : "light");
            document.documentElement.dataset.colorScheme = scheme;
        })();
    </script>

    <!-- Общие стили приложения. -->
    <link rel="stylesheet" href="./css/base.css?v=20261126-10">
    <link rel="stylesheet" href="./css/components.css?v=20261126-6">
    <link rel="stylesheet" href="./css/layout.css?v=20261126-4">
    <link rel="stylesheet" href="./css/menu.css?v=20261126-11">
    <link rel="stylesheet" href="./css/profile.css?v=20261126-8">
    <link rel="stylesheet" href="./css/pages.css?v=20261126-5">
    <link rel="stylesheet" href="./css/events.css?v=20261126-17">
    <link rel="stylesheet" href="./css/nominations.css?v=20261126-18">
    <link rel="stylesheet" href="./css/nominations-carousel.css?v=20261126-9">
    <link rel="stylesheet" href="./css/nominations-picker.css?v=20261126-1">
    <link rel="stylesheet" href="./css/nominations-cards.css?v=20261126-4">
    <link rel="stylesheet" href="./css/design-system.css?v=20261126-15">
    <link rel="stylesheet" href="./css/notifications.css?v=20261126-1">

    <!-- ES-модуль приложения загружает остальные JS-модули. -->
    <script type="module" src="./app.js?v=20261126-43"></script>
</head>

<body>
    <a class="skip-link" href="#main-content">
        Перейти к основному содержимому
    </a>

    <div id="app">
        <header class="site-header">
            <button
                id="menu-button"
                class="header-button ui-button ui-button--icon ui-button--secondary"
                type="button"
                aria-label="Открыть меню"
                aria-controls="menu-panel"
                aria-expanded="false"
                title="Меню"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    <path d="M4 7H20"></path>
                    <path d="M4 12H20"></path>
                    <path d="M4 17H20"></path>
                </svg>
            </button>

            <div class="header-logo" aria-label="Сплит">
                сплит
            </div>
        </header>

        <!-- БОКОВАЯ НАВИГАЦИЯ -->
        <div id="menu-overlay" class="menu-overlay" hidden>
            <button
                id="menu-backdrop"
                class="menu-backdrop"
                type="button"
                aria-label="Закрыть меню"
                tabindex="-1"
            ></button>

            <aside
                id="menu-panel"
                class="menu-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="menu-title"
                tabindex="-1"
            >
                <div class="menu-panel-header">
                    <h2 id="menu-title" class="menu-panel-title">Меню</h2>
                    <button
                        id="menu-close-button"
                        class="menu-close-button ui-button ui-button--icon ui-button--secondary"
                        type="button"
                        aria-label="Закрыть меню"
                        title="Закрыть меню"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <path d="M6 6L18 18"></path>
                            <path d="M18 6L6 18"></path>
                        </svg>
                    </button>
                </div>

                <nav class="menu-navigation" aria-label="Основная навигация">
                    <button id="home-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 10.5L12 3L21 10.5"></path>
                            <path d="M5 9.5V20H19V9.5"></path>
                            <path d="M9 20V14H15V20"></path>
                        </svg>
                        <span class="menu-item-label">Главная</span>
                    </button>

                    <button id="profile-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.5"></circle>
                            <path d="M5 20C5 16.4 8.1 14 12 14C15.9 14 19 16.4 19 20"></path>
                        </svg>
                        <span class="menu-item-label">Профиль</span>
                    </button>

                    <button id="events-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 8L7 4L10 8L13 4L16 8L19 4L21 7V20H3V7L4 8Z"></path>
                            <path d="M3 12H21"></path>
                            <path d="M8 12V20"></path>
                            <path d="M16 12V20"></path>
                        </svg>
                        <span class="menu-item-label">События</span>
                        <span
                            id="events-active-badge"
                            class="menu-item-badge"
                            role="status"
                            aria-live="polite"
                            hidden
                        ></span>
                    </button>

                    <button id="servers-nav-button" class="menu-item ui-button ui-button--nav ui-button--ghost" type="button">
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6.5 9H17.5C19.1 9 20.3 10.2 20.7 11.7L22 16.5C22.5 18.5 20.3 19.9 18.8 18.6L15.7 16H8.3L5.2 18.6C3.7 19.9 1.5 18.5 2 16.5L3.3 11.7C3.7 10.2 4.9 9 6.5 9Z"></path>
                            <path d="M7 11.5V15.5"></path>
                            <path d="M5 13.5H9"></path>
                            <circle cx="16.2" cy="12.5" r="0.8" fill="currentColor" stroke="none"></circle>
                            <circle cx="18.3" cy="14.5" r="0.8" fill="currentColor" stroke="none"></circle>
                        </svg>
                        <span class="menu-item-label">Сервера</span>
                    </button>

                    <button class="menu-item menu-item-coming-soon ui-button ui-button--nav ui-button--ghost" type="button" disabled>
                        <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <path d="M3 10H21"></path>
                            <path d="M8 5V10"></path>
                            <path d="M16 5V10"></path>
                        </svg>
                        <span class="menu-item-label">Human Glaze</span>
                        <span class="menu-item-badge menu-item-badge--accent">скоро</span>
                    </button>
                </nav>
            </aside>
        </div>

        <main id="main-content" class="page-content" tabindex="-1">
            <section
                id="home-page"
                class="page-view"
                aria-label="Главная страница"
            ></section>

            <section
                id="events-page"
                class="page-view"
                aria-label="Текущие события"
                hidden
            ></section>

            <section
                id="profile-page"
                class="page-view"
                aria-label="Профиль"
                hidden
            >
                <article class="profile-card" id="profile-card">
                    <div class="profile-cover" id="profile-cover">
                        <div
                            class="profile-banner-placeholder"
                            id="profile-banner-placeholder"
                            aria-hidden="true"
                        ></div>

                        <img
                            id="profile-banner-image"
                            class="profile-banner-image"
                            alt=""
                            hidden
                        >

                        <div class="profile-media-shade" aria-hidden="true"></div>

                        <button
                            id="banner-upload-button"
                            class="profile-media-upload-button banner-upload-button ui-button ui-button--icon ui-button--round ui-button--media"
                            type="button"
                            aria-label="Загрузить баннер"
                            title="Загрузить баннер"
                            tabindex="-1"
                        >
                            <svg
                                class="profile-media-icon profile-media-icon--plus"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                aria-hidden="true"
                            >
                                <path d="M12 5V19"></path>
                                <path d="M5 12H19"></path>
                            </svg>
                            <svg
                                class="profile-media-icon profile-media-icon--spinner"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true"
                            >
                                <circle cx="12" cy="12" r="8" stroke-dasharray="34 16"></circle>
                            </svg>
                            <svg
                                class="profile-media-icon profile-media-icon--error"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                aria-hidden="true"
                            >
                                <path d="M6 6L18 18"></path>
                                <path d="M18 6L6 18"></path>
                            </svg>
                        </button>

                        <div class="profile-avatar" id="profile-avatar">
                            <img
                                id="profile-avatar-image"
                                class="profile-avatar-image"
                                alt="Фотография профиля"
                                referrerpolicy="no-referrer"
                                hidden
                            >

                            <div
                                id="profile-avatar-placeholder"
                                class="profile-avatar-placeholder"
                                aria-hidden="true"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <circle cx="12" cy="8" r="3.5"></circle>
                                    <path d="M5 20C5 16.4 8.1 14 12 14C15.9 14 19 16.4 19 20"></path>
                                </svg>
                            </div>

                            <div class="profile-media-shade" aria-hidden="true"></div>

                            <button
                                id="avatar-upload-button"
                                class="profile-media-upload-button avatar-upload-button ui-button ui-button--icon ui-button--round ui-button--media"
                                type="button"
                                aria-label="Загрузить аватарку"
                                title="Загрузить аватарку"
                                tabindex="-1"
                            >
                            <svg
                                class="profile-media-icon profile-media-icon--plus"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                aria-hidden="true"
                            >
                                <path d="M12 5V19"></path>
                                <path d="M5 12H19"></path>
                            </svg>
                            <svg
                                class="profile-media-icon profile-media-icon--spinner"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true"
                            >
                                <circle cx="12" cy="12" r="8" stroke-dasharray="34 16"></circle>
                            </svg>
                            <svg
                                class="profile-media-icon profile-media-icon--error"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                aria-hidden="true"
                            >
                                <path d="M6 6L18 18"></path>
                                <path d="M18 6L6 18"></path>
                            </svg>
                        </button>
                        </div>
                    </div>

                    <div class="profile-details">
                        <div class="profile-name-row">
                            <span
                                id="nickname-display"
                                class="profile-nickname"
                            ></span>

                            <button
                                id="nickname-edit-button"
                                class="profile-edit-button ui-button ui-button--icon ui-button--secondary"
                                type="button"
                                aria-label="Изменить профиль"
                                title="Изменить профиль"
                            >
                                <svg
                                    class="nickname-edit-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <path d="M12 20H21"></path>
                                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
                                </svg>

                                <svg
                                    class="nickname-save-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                    hidden
                                >
                                    <path d="M5 12L10 17L20 7"></path>
                                </svg>
                            </button>
                        </div>

                        <p id="telegram-tag" class="profile-telegram-tag"></p>
                    </div>
                </article>

                <input
                    id="avatar-file-input"
                    class="visually-hidden-input"
                    type="file"
                    accept="image/*"
                    aria-label="Выбрать фотографию профиля"
                    tabindex="-1"
                >

                <input
                    id="banner-file-input"
                    class="visually-hidden-input"
                    type="file"
                    accept="image/*"
                    aria-label="Выбрать изображение баннера"
                    tabindex="-1"
                >
            </section>

            <!-- ВРЕМЕННАЯ СТРАНИЦА РАЗДЕЛА СЕРВЕРОВ -->
            <section
                id="servers-page"
                class="page-view"
                aria-label="Сервера"
                hidden
            ></section>

            <section
                id="nominations-page"
                class="page-view"
                aria-label="Номинации 2026"
                hidden
            >
                <div class="section-page nominations-page">
                    <div class="section-page-content nominations-page-content">
                        <header class="nominations-page-header">
                            <h1 class="section-page-title">НОМИНАЦИИ 2026</h1>
                        </header>

                        <div id="vote-widget" class="vote-widget">
                            <div
                                id="vote-nominations-list"
                                class="vote-nominations-list"
                                aria-label="Список номинаций"
                            ></div>

                            <div class="vote-overlay" id="vote-vote-overlay" hidden>
                                <section
                                    class="vote-dialog vote-dialog--nomination"
                                    role="dialog"
                                    aria-modal="true"
                                    aria-labelledby="vote-vote-title"
                                >
                                    <header class="vote-dialog-header">
                                        <p class="vote-dialog-eyebrow">НОМИНАЦИЯ</p>
                                        <h2 id="vote-vote-title" class="vote-dialog-title">
                                            Выбери номинанта
                                        </h2>
                                    </header>
                                    <div class="vote-grid-viewport">
                                        <div id="vote-nomination-grid" class="vote-grid"></div>
                                    </div>
                                    <footer class="vote-dialog-footer">
                                        <button
                                            id="vote-nomination-prev"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Предыдущие номинанты"
                                            disabled
                                        >‹</button>
                                        <button
                                            id="vote-vote-close"
                                            class="ui-button ui-button--secondary vote-close-button"
                                            type="button"
                                        >Закрыть</button>
                                        <button
                                            id="vote-nomination-next"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Следующие номинанты"
                                            disabled
                                        >›</button>
                                    </footer>
                                </section>
                            </div>

                            <div class="vote-overlay vote-picker-overlay" id="vote-picker-overlay" hidden>
                                <section
                                    class="vote-dialog"
                                    role="dialog"
                                    aria-modal="true"
                                    aria-labelledby="vote-picker-title"
                                >
                                    <header class="vote-dialog-header">
                                        <p class="vote-dialog-eyebrow">ДОБАВИТЬ НОМИНАНТА</p>
                                        <h2 id="vote-picker-title" class="vote-dialog-title">
                                            Добавить номинанта
                                        </h2>
                                    </header>
                                    <div class="vote-grid-viewport">
                                        <div id="vote-picker-grid" class="vote-grid"></div>
                                        <p id="vote-picker-empty" class="vote-empty-state" hidden>
                                            Все подходящие участники уже добавлены
                                        </p>
                                    </div>
                                    <footer class="vote-dialog-footer">
                                        <button
                                            id="vote-picker-prev"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Предыдущие участники"
                                            disabled
                                        >‹</button>
                                        <button
                                            id="vote-picker-close"
                                            class="ui-button ui-button--secondary vote-close-button"
                                            type="button"
                                        >Назад</button>
                                        <button
                                            id="vote-picker-next"
                                            class="ui-button ui-button--secondary ui-button--icon vote-page-button"
                                            type="button"
                                            aria-label="Следующие участники"
                                            disabled
                                        >›</button>
                                    </footer>
                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <div
            id="notification-region"
            class="notification-region"
            aria-label="уведомления"
        ></div>
    </div>

    <noscript>
        <p>Для работы SplitEvents необходимо включить JavaScript.</p>
    </noscript>
</body>
</html>
